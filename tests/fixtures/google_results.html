<!doctype html>
<html>
<head><title>Google Search Results</title></head>
<body>
<div id="search">
  <div class="g">
    <a href="https://example.com/page1">Example Page 1</a>
  </div>
  <div class="g">
    <a href="https://example.com/page2">Example Page 2</a>
  </div>
  <div class="g">
    <a href="/url?q=https://example.com/page3&sa=U">Example Page 3 (redirect)</a>
  </div>
  <div class="g">
    <a href="https://google.com/search?q=test">Google internal link</a>
  </div>
  <div class="g">
    <a href="/relative/path">Relative link (should be ignored)</a>
  </div>
</div>
</body>
</html>
